name: Review Gate

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize, review_requested]
  pull_request_review:
    types: [submitted, dismissed]

jobs:
  require-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: 리뷰 승인 1명 이상 확인
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            if (pr.draft) {
              core.info("드래프트 PR은 리뷰를 요구하지 않습니다.");
              return;
            }

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const approvals = reviews.filter(
              (r) => r.state === "APPROVED" && r.user && r.user.login !== pr.user.login
            );

            if (approvals.length === 0) {
              core.setFailed("병합하려면 최소 1명의 리뷰 승인이 필요합니다.");
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: "⚠️ **리뷰 승인 필요** — 병합하려면 최소 1명의 승인 리뷰가 필요합니다.",
              });
              return;
            }

            core.info(`승인 ${approvals.length}명 확인됨: ${approvals.map(a => a.user.login).join(", ")}`);
